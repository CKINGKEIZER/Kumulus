<!-- @dsCard group="Slides" viewport="1280x720" name="Chrome — cover & divider (themed)" subtitle="Deal-themed cover + frosted ToC divider; theme-cobalt" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{margin:0;height:100%;background:#54585d}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #slide-root{width:1280px;height:720px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div id="stage"><div id="slide-root"><div id="app"></div></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SlideFrame } = window.KumulusPartnersDesignSystem_533273;
    const sections = [
      { num: "I", label: "Executive summary" },
      { num: "II", label: "Key investment highlights" },
      { num: "III", label: "Transaction financials" },
      { num: "A", label: "Appendix" },
    ];
    function Demo() {
      const [v, setV] = React.useState("cover");
      return (
        <div className="theme-cobalt" style={{ position: "relative", width: 1280, height: 720 }}>
          {v === "cover" ? (
            <SlideFrame variant="cover"
              coverTitle="Project [x] – Information Memorandum"
              coverDate="[Month] [Year]"
              confidential="Strictly private and confidential"
              targetLogoSrc={null} />
          ) : (
            <SlideFrame variant="divider"
              sections={sections} activeSection="I"
              projectName="Project [x] | [Month] [Year]"
              sectionTabs={[{n:"1",label:"Executive summary"},{n:"A",label:"Appendix"}]}
              activeTab="1" activeLabel="Executive summary" pageNumber={4} />
          )}
          <div style={{ position: "absolute", top: 10, right: 10, display: "flex", gap: 6, zIndex: 20 }}>
            {["cover","divider"].map(k=>(
              <button key={k} onClick={()=>setV(k)} style={{ font: "600 11px 'Source Sans Pro',sans-serif", padding: "5px 10px", border: "none", borderRadius: 4, cursor: "pointer", background: v===k?"#0049da":"#fff", color: v===k?"#fff":"#333" }}>{k}</button>
            ))}
          </div>
        </div>
      );
    }
    function fit(){const r=document.getElementById('slide-root');const s=Math.min(innerWidth/1280,innerHeight/720);r.style.transform=`scale(${s})`;r.style.transformOrigin='center center';}
    addEventListener('resize',fit);fit();
    ReactDOM.createRoot(document.getElementById('app')).render(<Demo />);
  </script>
</body>
</html>
