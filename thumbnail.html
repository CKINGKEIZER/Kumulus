<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-serif)}
  .main{flex:1 1 auto;background:var(--cobalt-600);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main h1{margin:0;color:#fff;font-weight:400;font-size:150px;line-height:.98;letter-spacing:-.01em}
  .main .p{font-weight:700}
  .strip{flex:0 0 150px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><h1>Kumulus<br/><span class="p">Partners</span></h1></div>
    <div class="strip">
      <div style="background:var(--sky-400)"></div>
      <div style="background:var(--green-600)"></div>
      <div style="background:var(--navy-800)"></div>
    </div>
  </div>
</body>
</html>
