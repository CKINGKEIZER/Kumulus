<!-- @dsCard group="Components" viewport="700x300" name="Feature — quote, process, connector" subtitle="PullQuote, ProcessSteps, ArrowConnector" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-body); }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 30px; padding: 26px 28px; align-items: start; }
  .cap { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <p class="cap">PullQuote</p>
      <div id="pq"></div>
      <p class="cap" style="margin-top:20px;">ArrowConnector</p>
      <div id="arrows" style="display:flex; gap:14px; align-items:center;"></div>
    </div>
    <div>
      <p class="cap">ProcessSteps</p>
      <div id="ps"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { PullQuote, ProcessSteps, ArrowConnector } = window.KumulusPartnersDesignSystem_533273;
    ReactDOM.createRoot(document.getElementById('pq')).render(
      <PullQuote variant="card"
        quote="Our advisor not only provides excellent advice but genuinely listens to our needs."
        author="[Customer name]" role="[Role, Company]" />
    );
    ReactDOM.createRoot(document.getElementById('arrows')).render(
      <React.Fragment><ArrowConnector direction="down" /><ArrowConnector direction="right" /></React.Fragment>
    );
    ReactDOM.createRoot(document.getElementById('ps')).render(
      <ProcessSteps steps={[
        {title:"First contact", items:["Inbound leads contacted by sales","Intro meeting & product demo"]},
        {title:"Detailed proposal", items:["Fit-gap analysis as basis for the quote"]},
        {title:"Periodic follow-up", items:["Cross-sell across business units"]}
      ]} />
    );
  </script>
</body>
</html>
