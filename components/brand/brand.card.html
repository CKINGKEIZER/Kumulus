<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../styles.css" />

      <div id="p2"></div>
      <span class="cap">Target placeholder · cover</span>
    </div>
    <div class="col">
      <div id="p3"></div>
      <span class="cap">Third-party (neutral)</span>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { KumulusMark, TargetCompanyLogoPlaceholder, ThirdPartyLogoPlaceholder } = window.KumulusPartnersDesignSystem_533273;
    ReactDOM.createRoot(document.getElementById('m1')).render(<KumulusMark height={24} />);
    ReactDOM.createRoot(document.getElementById('m2')).render(<KumulusMark height={40} />);
    ReactDOM.createRoot(document.getElementById('p1')).render(<TargetCompanyLogoPlaceholder variant="footer-small" />);
    ReactDOM.createRoot(document.getElementById('p2')).render(<TargetCompanyLogoPlaceholder variant="cover-large" />);
