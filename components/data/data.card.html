<!-- @dsCard group="Components" viewport="700x420" name="Tables & matrix" subtitle="FinancialTable + ComparisonMatrix (harvey balls)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);background:var(--white)}.wrap{padding:18px 22px;display:grid;grid-template-columns:1.3fr 1fr;gap:22px}</style>
</head>
<body>
  <div class="wrap theme-bemedico">
    <div id="ft"></div>
    <div id="cm"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { FinancialTable, ComparisonMatrix } = window.KumulusPartnersDesignSystem_533273;
    ReactDOM.createRoot(document.getElementById('ft')).render(
      <FinancialTable
        columns={[{label:"FY23A"},{label:"FY24A"},{label:"LTM Jun-25"},{label:"CAGR"}]}
        rows={[
          {label:"Gross revenue", values:["16.6","19.1","19.8","9.0 %"], bold:true, marker:1},
          {label:"Net revenue", values:["14.8","16.6","17.0","8.4 %"], subtotal:true, marker:2},
          {label:"Cost of sales", values:["(7.9)","(8.7)","(9.0)","8.9 %"]},
          {label:"Gross profit", values:["6.9","7.9","8.1","7.8 %"], subtotal:true},
          {label:"Management", values:["(0.5)","(0.5)","(0.5)","3.9 %"], indent:true},
          {label:"EBITDA", values:["2.0","2.9","3.1","19.5 %"], subtotal:true},
        ]}
        kpis={[
          {label:"EBITDA margin (% of net revenue)", values:["13.6 %","17.7 %","17.9 %",""]},
        ]}
        note="Note: (1) Excluding goodwill" />
    );
    ReactDOM.createRoot(document.getElementById('cm')).render(
      <ComparisonMatrix tabLabel="Competitors" firstColHead="Player"
        columns={[{label:"Scale"},{label:"Specialism"},{label:"Service"}]}
        rows={[
          {label:"BeMedico", cells:[3,4,4]},
          {label:"Generalist A", cells:[4,1,2]},
          {label:"Niche B", cells:[1,3,3]},
          {label:"Local C", cells:[2,2,1]},
        ]} />
    );
  </script>
</body>
</html>
