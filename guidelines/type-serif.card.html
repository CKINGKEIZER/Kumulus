<!-- @dsCard group="Type" viewport="700x180" name="Serif — titles & quotes" subtitle="Merriweather: slide title, subtitle, pull-quote (sentence case, never Title Case)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:#fff;padding:16px 22px}.spec{margin-bottom:12px}.spec .m{font-size:9px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}</style></head>
<body>
<div class="spec"><div class="m">Slide title · Merriweather 22px</div><div style="font-family:var(--font-serif);font-size:var(--fs-title);color:var(--ink);line-height:1.15">Highly diversified customer base with limited dependency</div></div>
<div class="spec"><div class="m">Subtitle · 15px italic</div><div style="font-family:var(--font-serif);font-style:italic;font-size:var(--fs-subtitle);color:var(--text-body)">Independent distributor of innovative products for medical professionals</div></div>
<div class="spec"><div class="m">Pull-quote · 13px italic</div><div style="font-family:var(--font-serif);font-style:italic;font-size:var(--fs-quote);color:var(--text-muted);line-height:1.5">“Our advisor not only provides excellent advice but genuinely listens to our needs.”</div></div>
</body></html>
