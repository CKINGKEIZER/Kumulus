<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool grays: bands, hairlines, captions, charcoal ink" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:#fff}.row{display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}.sw .n{font-size:10px;font-weight:700;letter-spacing:.04em}.sw .h{font-size:9px;opacity:.8;font-variant-numeric:tabular-nums}.dark{color:#fff}.light{color:var(--ink)}</style></head>
<body><div class="row">
<div class="sw light" style="background:var(--gray-50);border-right:1px solid #eee"><span class="n">gray-50</span><span class="h">#f6f6f6</span></div>
<div class="sw light" style="background:var(--gray-100)"><span class="n">gray-100 · band</span><span class="h">#f2f2f2</span></div>
<div class="sw light" style="background:var(--gray-200)"><span class="n">gray-200 · rule</span><span class="h">#d9d9d9</span></div>
<div class="sw light" style="background:var(--gray-400)"><span class="n">gray-400</span><span class="h">#a6a6a6</span></div>
<div class="sw dark" style="background:var(--gray-500)"><span class="n">gray-500 · caption</span><span class="h">#808080</span></div>
<div class="sw dark" style="background:var(--gray-700)"><span class="n">gray-700</span><span class="h">#5b5f66</span></div>
<div class="sw dark" style="background:var(--ink)"><span class="n">ink · text/title</span><span class="h">#23282d</span></div>
</div></body></html>
