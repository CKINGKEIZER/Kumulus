<!-- @dsCard group="Colors" viewport="700x150" name="Accent & semantic" subtitle="Sky secondary, green positive/ESG, warm sand, coral mark dot" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:#fff}.row{display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}.sw .n{font-size:10px;font-weight:700;letter-spacing:.04em}.sw .h{font-size:9px;opacity:.8;font-variant-numeric:tabular-nums}.dark{color:#fff}.light{color:var(--ink)}</style></head>
<body><div class="row">
<div class="sw light" style="background:var(--sky-400)"><span class="n">sky-400</span><span class="h">#78caf0</span></div>
<div class="sw light" style="background:var(--sky-200)"><span class="n">sky-200 · capsule</span><span class="h">#becef0</span></div>
<div class="sw light" style="background:var(--sky-100)"><span class="n">sky-100</span><span class="h">#e3edfb</span></div>
<div class="sw dark" style="background:var(--green-600)"><span class="n">green-600 · positive</span><span class="h">#1f9433</span></div>
<div class="sw dark" style="background:var(--green-400)"><span class="n">green-400</span><span class="h">#6cc879</span></div>
<div class="sw light" style="background:var(--sand-100)"><span class="n">sand-100 · case study</span><span class="h">#ede9e3</span></div>
<div class="sw dark" style="background:var(--accent-coral)"><span class="n">coral · mark dot</span><span class="h">#e0185a</span></div>
</div></body></html>
