<!-- @dsCard group="Colors" viewport="700x150" name="Brand ramp — cobalt & navy" subtitle="Primary cobalt does the brand work; navy anchors charts + wordmark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:#fff}.row{display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;color:#fff}.sw .n{font-size:10px;font-weight:700;letter-spacing:.04em}.sw .h{font-size:9px;opacity:.85;font-variant-numeric:tabular-nums}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--cobalt-700)"><span class="n">cobalt-700</span><span class="h">#0a3d8f</span></div>
<div class="sw" style="background:var(--cobalt-600)"><span class="n">cobalt-600 · PRIMARY</span><span class="h">#0049da</span></div>
<div class="sw" style="background:var(--cobalt-500)"><span class="n">cobalt-500</span><span class="h">#1f63e6</span></div>
<div class="sw" style="background:var(--cobalt-400)"><span class="n">cobalt-400</span><span class="h">#5a8fef</span></div>
<div class="sw" style="background:var(--navy-800)"><span class="n">navy-800</span><span class="h">#14335f</span></div>
<div class="sw" style="background:var(--navy-900)"><span class="n">navy-900</span><span class="h">#0c2447</span></div>
</div></body></html>
