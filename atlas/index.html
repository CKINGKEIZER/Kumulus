function refreshSub(){const fam=fFam.value;const subs=[...new Set(DATA.filter(d=>!fam||d.family===fam).map(d=>d.subfamily))].filter(Boolean).sort();fSub.innerHTML='<option value="">All subfamilies</option>';for(const s of subs)fSub.add(new Option(s,s));}
refreshSub();
const stStr=s=>Object.entries(s||{}).map(([k,v])=>k[0]+v).join(' ');
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const fk=fDeck.value,ff=fFam.value,fs=fSub.value,fc=fCanon.checked;
 const rows=DATA.filter(d=>(!q||(d.title+d.excerpt).toLowerCase().includes(q))&&(!fk||d.deck===fk)&&(!ff||d.family===ff)&&(!fs||d.subfamily===fs)&&(!fc||d.isCanonical));
 document.getElementById('count').textContent=rows.length+' of '+DATA.length+' slides';
 grid.innerHTML=rows.map(d=>`<div class="card ${d.isCanonical?'canon':''}">${d.thumb?`<img loading="lazy" src="${d.thumb}" style="width:100%;border:1px solid var(--gray-200);border-radius:4px;display:block;margin-bottom:6px"/>`:''}<div class="id"><span>${d.id} · p${d.page}</span>${d.isCanonical?'<span class="star">★ canonical</span>':''}</div><h3>${d.title}</h3><div class="tags"><span class="tag deck">${d.deck}</span><span class="tag fam">${d.family||'—'}</span><span class="tag sub">${d.subfamily||'—'}</span></div><div class="st">${stStr(d.struct)} · ${d.words}w · ${d.density}</div></div>`).join('');
}
fFam.addEventListener('change',()=>{refreshSub();render();});
for(const el of [q,fDeck,fSub,fCanon]) el.addEventListener('input',render);
render();
</script></body></html>
